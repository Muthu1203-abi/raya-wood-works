<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3d2312">
<title>Raya Wood Works</title>
<link rel="stylesheet" href="vendor/tabler/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --blue:#1F3864;--blue2:#2E75B6;--gold:#C9A227;--gold-ink:#2b2200;--sky:#BDD7EE;
  --bg:#f5f3ee;--card:#fff;--line:#e7e2d6;--line2:#d9d3c4;--text:#1d1d1b;--sub:#6b6b66;--muted:#8a877f;
  --due-bg:#FAEEDA;--due:#854F0B;--paid-bg:#EAF3DE;--paid:#27500A;--draft-bg:#F1EFE8;--draft:#444441;
  --late-bg:#FCEBEB;--late:#791F1F;--info-bg:#EBF4FF;--info:#0C447C;--green:#0F6E56;--ok:#3B6D11;
  --wa:#25D366;--wa-ink:#06381c;--red:#A32D2D;
  --safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);
}
html,body{background:var(--bg)}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans Tamil',Arial,sans-serif;color:var(--text);font-size:14px;min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:inherit}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}

/* HEAD */
/* Dark walnut wood grain (header + sidebar top) */
.walnut{background-color:#4a2c17;background-image:repeating-linear-gradient(92deg,rgba(255,255,255,.05) 0 2px,transparent 2px 9px),repeating-linear-gradient(88deg,rgba(0,0,0,.18) 0 1px,transparent 1px 14px),repeating-linear-gradient(90.6deg,rgba(255,220,170,.06) 0 3px,transparent 3px 37px),linear-gradient(180deg,#6b4226,#3d2312)}
.head{position:sticky;top:0;z-index:50;color:#fff;border-bottom:3px solid var(--gold);box-shadow:0 2px 10px rgba(0,0,0,.25)}
.topbar{padding:calc(8px + var(--safe-top)) 6px 8px;display:flex;align-items:center;gap:2px;min-height:58px;max-width:760px;margin:0 auto}
.topbar .title{flex:1;font-family:Georgia,'Times New Roman',serif;color:#F2D27A;letter-spacing:.3px;font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.topbar .tag{font-size:12px;color:#e8d3b0;padding:0 10px;white-space:nowrap}
.icon-btn{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.icon-btn:active{background:rgba(255,255,255,.15)}
.topbar .icon-btn{color:#f3e6cf}
.brand{flex:1;display:flex;align-items:center;gap:10px;min-width:0;padding:0 4px}
.brand img{width:38px;height:38px;border-radius:9px;object-fit:contain;background:#fff;flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.brand .name{font-family:Georgia,'Times New Roman',serif;color:#F2D27A;font-size:18px;font-weight:600;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .sub{font-size:10.5px;letter-spacing:1.2px;color:#e8d3b0;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.stepper{display:flex;align-items:center;gap:6px;padding:0 16px 12px;font-size:12.5px;color:#e8d3b0;max-width:760px;margin:0 auto}
.stepper button{font-size:12.5px;white-space:nowrap;color:#e8d3b0}
.stepper .on{color:#F2D27A;font-weight:700}
.stepper .ln{flex:1;height:2px;background:rgba(255,255,255,.25);border-radius:1px;min-width:12px}
.stepper .ln.ok{background:var(--gold)}

/* LAYOUT */
main{max-width:560px;margin:0 auto;padding:12px 12px 110px}
body.editor main{padding-bottom:170px}
.card{display:block;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
button.card:active,a.card:active{background:#faf8f3}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.b{font-weight:600}
.m{color:var(--sub);font-size:12.5px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 8px;font-weight:600}
.sec-h button{color:var(--blue2);font-size:13px;font-weight:500}
.sec{color:var(--blue2);font-size:12px;font-weight:700;margin:18px 4px 6px;text-transform:uppercase;letter-spacing:.5px}
.pill{font-size:11.5px;padding:2px 9px;border-radius:10px;white-space:nowrap;font-weight:500}
.pill.due{background:var(--due-bg);color:var(--due)}
.pill.paid{background:var(--paid-bg);color:var(--paid)}
.pill.draft{background:var(--draft-bg);color:var(--draft)}
.pill.late{background:var(--late-bg);color:var(--late)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .v{font-size:19px;font-weight:700;margin-top:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line2);background:#fff;border-radius:16px;padding:6px 12px;font-size:13px}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 12px;margin-bottom:10px;color:var(--muted)}
.search input{flex:1;border:none;outline:none;padding:11px 0;background:transparent;font-size:15px;color:var(--text);min-width:0}
.empty{text-align:center;color:var(--sub);padding:36px 16px}
.empty i{font-size:42px;display:block;margin-bottom:10px;color:var(--line2)}
.av{width:42px;height:42px;border-radius:50%;background:var(--info-bg);color:var(--info);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;font-size:14px}
.progress{height:8px;background:#efeae0;border-radius:4px;overflow:hidden}
.progress>div{height:100%;background:var(--ok);border-radius:4px}

/* FORMS */
.field{margin-bottom:12px}
.field label,.lbl{display:block;font-size:12.5px;color:var(--sub);margin-bottom:5px}
.inp{width:100%;background:#fff;border:1.5px solid var(--line2);border-radius:10px;padding:11px 12px;font-size:16px;outline:none}
.inp:focus{border-color:var(--blue2)}
textarea.inp{resize:vertical;min-height:96px;line-height:1.5}
.pct{width:70px;padding:7px 8px;font-size:15px;text-align:center}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.sheet{overflow-x:hidden}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:13px;font-weight:600;font-size:15px;width:100%;text-align:center}
.btn:active{transform:scale(.98)}
.btn i{font-size:19px}
.btn-primary{background:var(--blue);color:#fff}
.btn-gold{background:var(--gold);color:var(--gold-ink)}
.btn-wa{background:var(--wa);color:var(--wa-ink)}
.btn-green{background:var(--green);color:#fff}
.btn-soft{background:var(--info-bg);color:var(--info)}
.btn-danger{background:var(--late-bg);color:var(--red)}
.btn-line{background:#fff;border:1.5px solid var(--line2);color:var(--blue)}
.dashed{display:block;width:100%;border:1.5px dashed var(--blue2);color:var(--blue2);border-radius:14px;padding:14px;text-align:center;font-weight:600;background:transparent}
.link{color:var(--blue2);font-size:12.5px;font-weight:500}
.toggle{width:46px;height:26px;background:#d9d3c4;border-radius:13px;position:relative;flex-shrink:0;transition:background .2s}
.toggle.on{background:var(--blue)}
.toggle::after{content:'';position:absolute;width:20px;height:20px;background:#fff;border-radius:50%;top:3px;left:3px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.toggle.on::after{left:23px}
.seg{display:flex;border:1.5px solid var(--line2);border-radius:10px;overflow:hidden;background:#fff}
.seg button{flex:1;padding:9px 0;font-size:14px;text-align:center;border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg .on{background:var(--blue);color:#fff}
.num{display:flex;align-items:center;border:1.5px solid var(--line2);border-radius:10px;background:#fff;overflow:hidden}
.num button{width:44px;height:46px;font-size:22px;color:var(--blue);text-align:center;flex-shrink:0}
.num button:active{background:var(--info-bg)}
.num input{flex:1;min-width:0;border:none;text-align:center;font-size:17px;font-weight:600;outline:none;padding:10px 0;background:transparent}
.calc{background:var(--info-bg);color:var(--info);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;margin:14px 0}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #f0ece2;width:100%}
.srow:last-child{border-bottom:none}
.err{color:var(--red);font-size:12.5px;min-height:16px;margin:6px 0}

/* NAV + FOOT */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;border-top:3px solid var(--gold);box-shadow:0 -2px 10px rgba(0,0,0,.25);padding:6px 4px calc(8px + var(--safe-bot))}
.bnav-in{display:flex;justify-content:space-around;align-items:flex-end;max-width:560px;margin:0 auto}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:#d9c4a3;padding:2px 0}
.bnav i{font-size:23px}
.bnav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.bnav .on{color:#F2D27A;font-weight:700}
.bnav .on i{text-shadow:0 0 8px rgba(242,210,122,.45)}
.bnav .fab{flex:0 0 auto;width:58px;height:58px;border-radius:50%;background:linear-gradient(180deg,#e0bb45,#b8901c);color:#3d2312;justify-content:center;margin:-30px 6px 0;border:4px solid #4a2c17;box-shadow:0 0 0 2px var(--gold),0 3px 8px rgba(0,0,0,.35)}
.bnav .fab i{font-size:28px}
.footbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + var(--safe-bot))}
.footbar-in{max-width:560px;margin:0 auto}
.mini-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px}
.mini-actions button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--sub);padding:4px 0;border-radius:8px}
.mini-actions button:active{background:var(--info-bg)}
.mini-actions i{font-size:21px;color:var(--blue)}
body.kb .bnav,body.kb .footbar{display:none}

/* OVERLAYS */
.scrim{position:fixed;inset:0;background:rgba(20,18,14,.5);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(82vw,320px);background:#fff;z-index:90;transform:translateX(-102%);transition:transform .22s ease;display:flex;flex-direction:column;overflow-y:auto}
.drawer.show{transform:none}
.drawer-head{color:#fff;border-bottom:3px solid var(--gold);padding:calc(22px + var(--safe-top)) 18px 16px}
.drawer-head .b{font-family:Georgia,'Times New Roman',serif;color:#F2D27A}
.drawer-head img{width:58px;height:58px;border-radius:12px;object-fit:contain;background:#fff;margin-bottom:10px;display:block}
.dl{display:flex;align-items:center;gap:14px;padding:13px 20px;font-size:15px;width:calc(100% - 12px)}
.dl i{font-size:21px;color:var(--sub)}
.dl.on{background:var(--info-bg);color:var(--info);font-weight:700;border-radius:0 24px 24px 0}
.dl.on i{color:var(--info)}
.dl:active{background:#f4f1ea}
.drawer-foot{margin-top:auto;padding:14px 20px calc(14px + var(--safe-bot));font-size:12.5px;color:var(--sub);border-top:1px solid var(--line)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:90;background:#fff;border-radius:20px 20px 0 0;max-height:92vh;overflow-y:auto;transform:translateY(105%);transition:transform .22s ease;padding:10px 16px calc(16px + var(--safe-bot))}
.sheet.show{transform:none}
.sheet-in{max-width:560px;margin:0 auto}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 12px}
.sheet h3{font-size:17px;margin-bottom:12px}

/* REPORTS */
.bars{display:flex;gap:8px;align-items:stretch;height:170px;margin-top:8px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.bar-pair{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px}
.bar{width:38%;border-radius:4px 4px 0 0;min-height:2px}
.bar.q{background:var(--blue)}.bar.r{background:var(--ok)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--sub);margin-top:8px}
.legend span::before{content:'';display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}

/* A4 */
#a4-off{position:fixed;left:-9999px;top:0;width:794px;background:#fff;font-family:Arial,sans-serif;pointer-events:none}
#a4-page{width:794px;min-height:1123px;padding:50px;display:flex;flex-direction:column}
.thumb{width:72px;height:102px;overflow:hidden;border:1px solid var(--line2);border-radius:4px;background:#fff;flex-shrink:0;position:relative}
.thumb>div{width:794px;min-height:1123px;display:flex;flex-direction:column;transform:scale(.0907);transform-origin:0 0;position:absolute;top:0;left:0;padding:50px;font-family:Arial,sans-serif}
.pv-box{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:6px;background:#fff}
.pv-box>div{width:794px;min-height:1123px;display:flex;flex-direction:column;padding:50px;transform-origin:0 0;position:absolute;top:0;left:0;font-family:Arial,sans-serif}

.toast{position:fixed;bottom:calc(100px + var(--safe-bot));left:50%;transform:translateX(-50%) translateY(30px);opacity:0;background:#1d1d1b;color:#fff;padding:10px 20px;border-radius:24px;font-size:13.5px;z-index:120;transition:all .25s;max-width:90vw;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.status-line{font-size:12.5px;color:var(--sub);text-align:center;min-height:16px;margin-top:6px}
</style>
<script type="module" src="vendor/native-plugins.js"></script>
</head>

<div class="scrim" id="scrim" onclick="closeOverlay()"></div>

<div class="sheet" id="sheet" role="dialog"></div>
<div id="a4-off"><div id="a4-page"></div></div>

  offlineTitle:'காப்பு கோப்பு',offlineSub:'எல்லா விலைப்புள்ளிகளும் அமைப்புகளும் ஒரே கோப்பாக சேமிக்கப்படும். WhatsApp, Drive app அல்லது கைபேசியில் வைத்துக்கொள்ளுங்கள். புதிய கைபேசியில் "கோப்பிலிருந்து மீட்டமை" அழுத்தி அதைத் தேர்ந்தெடுக்கவும். Google அமைப்பு தேவையில்லை.',

// ═══════════════ HELPERS ═══════════════
function t(k){const v=TEXT[language]?.[k];return v!=null?v:(TEXT.en[k]!=null?TEXT.en[k]:k)}
function tf(k,vars){return t(k).replace(/\{(\w+)\}/g,(_,n)=>vars[n]!=null?vars[n]:'')}
function locale(){return language==='ta'?'ta-IN':'en-IN'}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fs(w,f){return (w||0)+(f===.25?'¼':f===.5?'½':f===.75?'¾':'')}
function ct(w,wf,h,hf){return(w+(wf||0))*(h+(hf||0))}
function fmt(n){return Math.round(+n||0).toLocaleString('en-IN')}
function fmtShort(n){n=+n||0;if(n>=1e5)return '₹'+(n/1e5).toFixed(1).replace(/\.0$/,'')+'L';if(n>=1e3)return '₹'+Math.round(n/1e3)+'k';return '₹'+fmt(n)}
function fmtTs(n){return parseFloat((+n||0).toFixed(2)).toString()}
function localISODate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function defaultValidTill(){const d=new Date();d.setDate(d.getDate()+30);return localISODate(d)}
function monthKey(d){return d.getFullYear()+'-'+d.getMonth()}
function fmtDate(d,opt){try{return d.toLocaleDateString(locale(),opt||{day:'numeric',month:'short'})}catch(e){return d.toDateString()}}
function daysSince(d){return Math.max(0,Math.floor((Date.now()-d.getTime())/864e5))}
function initials(name){const p=String(name||'').trim().split(/\s+/).filter(Boolean);return ((p[0]?Array.from(p[0])[0]:'')+(p[1]?Array.from(p[1])[0]:'')).toUpperCase()||'?'}
function builtInNotes(){return language==='ta'?'• முன்பணம்: 30%\n• பாதி வேலை முடிந்ததும்: 50%\n• முழு வேலை முடிந்ததும்: மீதி 20%':'• Advance: 30%\n• After Half Work Complete: 50%\n• After Full Work Complete: Balance 20%'}
function defaultNotes(){return String(settings.defaultNotes||'').trim()?settings.defaultNotes:builtInNotes()}
function countLabel(n,one,many){return n===1?t(one):tf(many,{n})}

function loadData(){
  try{quotes=JSON.parse(localStorage.getItem('srw_hist')||'[]');if(!Array.isArray(quotes))quotes=[]}catch(e){quotes=[]}
  try{const s=JSON.parse(localStorage.getItem('srw_settings')||'null');if(s)settings={...DEFAULT_SETTINGS,...s}}catch(e){}
  // Phones saved in the old order (Muthubalan first) switch to Sakthivel first, unless the user edited them.
  if(String(settings.bizPhones||'').replace(/\r/g,'').trim()==='MUTHUBALAN: 93842 86406\nSAKTHIVEL: 78457 38353'){settings.bizPhones=DEFAULT_SETTINGS.bizPhones;saveSettings()}
  // Older settings kept contacts as free text lines ("NAME: phone"); turn them into name + phone pairs once.
  try{const raw=JSON.parse(localStorage.getItem('srw_settings')||'null');if(raw&&!Array.isArray(raw.contacts)){settings.contacts=String(settings.bizPhones||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const k=l.indexOf(':');return k>0?{name:l.slice(0,k).trim(),phone:l.slice(k+1).trim()}:{name:'',phone:l}});saveSettings()}}catch(e){}
}
function persistQuotes(){localStorage.setItem('srw_hist',JSON.stringify(quotes))}
// Only write (and bump the sync timestamp) when the stored settings really change.
function saveSettings(){
  const data=JSON.stringify(settings);
  if(data===localStorage.getItem('srw_settings'))return;
  localStorage.setItem('srw_settings',data);localStorage.setItem('srw_settings_updated',new Date().toISOString());
}
function updateSetting(k,v){settings[k]=v;saveSettings()}
function getDeleted(){try{return JSON.parse(localStorage.getItem('srw_deleted')||'{}')||{}}catch(e){return {}}}
function setDeleted(map){localStorage.setItem('srw_deleted',JSON.stringify(map))}
function markDeleted(ids){const map=getDeleted(),now=new Date().toISOString();ids.forEach(id=>{map[String(id)]=now});setDeleted(map)}

// Item units: sqft (width × height), rft (running length), nos (per piece), ls (lumpsum). Old items have no unit = sqft.
const UNITS=['sqft','rft','nos','ls'];
function unitOf(it){return UNITS.includes(it.unit)?it.unit:'sqft'}
function itemArea(it){const u=unitOf(it);if(u==='sqft')return ct(+it.w||0,+it.wf||0,+it.h||0,+it.hf||0);if(u==='rft')return (+it.w||0)+(+it.wf||0);return 1}
function itemTotal(it){return itemArea(it)*(+it.price||0)*(unitOf(it)==='ls'?1:(+it.qty||1))}
function itemSizeText(it){const u=unitOf(it);if(u==='sqft')return fs(+it.w||0,+it.wf||0)+' × '+fs(+it.h||0,+it.hf||0);if(u==='rft')return fs(+it.w||0,+it.wf||0);return ''}
function itemMeasureText(it){const u=unitOf(it);return u==='sqft'||u==='rft'?fmtTs(itemArea(it))+' '+t('u_'+u):''}
function calcTotals(items,tax){
  const sub=(items||[]).reduce((s,it)=>s+itemTotal(it),0);
  const disc=tax.disc?sub*(+tax.discVal||0)/100:0;
  const gst=tax.gst?(sub-disc)*(+tax.gstVal||0)/100:0;
  return {sub,disc,gst,total:sub-disc+gst};
}
function sumPayments(list){return (list||[]).reduce((s,p)=>s+(+p.amount||0),0)}
function entryPayments(e){return Array.isArray(e.payments)?e.payments:(+e.paid?[{amount:+e.paid,date:e.updatedAt||new Date(+e.id||Date.now()).toISOString()}]:[])}
function entryPaid(e){return sumPayments(entryPayments(e))}
function entryBalance(e){return Math.max(0,(+e.total||0)-entryPaid(e))}
function statusOf(e){if(e.draft)return 'draft';return entryBalance(e)<=0.5?'paid':'due'}
function entryCreated(e){const n=Number(e.id);return isFinite(n)&&n>1e11?new Date(n):new Date()}
function findQuote(id){return quotes.find(e=>String(e.id)===String(id))}
function allPayments(){return quotes.flatMap(e=>entryPayments(e).map(p=>({...p,e})))}
function quoteNumberOf(e){const m=/^Q(\d+)$/i.exec(String(e?.quotNo||''));return m?parseInt(m[1],10):0}
function nextQuoteNo(){return 'Q'+String(settings.quotNum||1).padStart(3,'0')}
function currentQuoteNo(){return q&&q.quotNo?q.quotNo:nextQuoteNo()}
function ensureQuotNumAboveHistory(){
  const top=quotes.reduce((mx,e)=>Math.max(mx,quoteNumberOf(e)),0);
  if((settings.quotNum||1)<=top){settings.quotNum=top+1;saveSettings()}
}
function custKey(e){const d=String(e.phone||'').replace(/\D/g,'');return d?'p'+d.slice(-10):'n'+String(e.name||'').trim().toLowerCase()}
function getCustomers(){
  const map=new Map();
  quotes.forEach(e=>{
    const name=String(e.name||'').trim();if(!name)return;
    const k=custKey(e);let c=map.get(k);
    if(!c){c={key:k,name,place:e.place||'',phone:e.phone||'',quotes:[],business:0,due:0,last:0};map.set(k,c)}
    c.quotes.push(e);if(!e.draft){c.business+=+e.total||0;c.due+=entryBalance(e)}
    c.last=Math.max(c.last,+e.id||0);
  });
  return [...map.values()].sort((a,b)=>b.last-a.last);
}
function waNumber(phone){let d=String(phone||'').replace(/\D/g,'');if(d.length===10)d='91'+d;return d}

function newQuoteObj(pre){
  return {id:null,quotNo:'',date:'',draft:true,name:pre?.name||'',place:pre?.place||'',phone:pre?.phone||'',validTill:defaultValidTill(),notes:defaultNotes(),items:[],payments:[],
    tax:{gst:!!settings.gst,gstVal:+settings.gstVal||0,disc:!!settings.disc,discVal:+settings.discVal||0}};
}
function quoteFromEntry(e){
  const s=e.settings||{};
  return {id:e.id,quotNo:e.quotNo||'',date:e.date||'',draft:!!e.draft,name:e.name||'',place:e.place||'',phone:e.phone||'',validTill:e.validTill||'',notes:e.notes||'',
    items:JSON.parse(JSON.stringify(e.items||[])),payments:JSON.parse(JSON.stringify(entryPayments(e))),
    tax:{gst:s.gst!=null?!!s.gst:!!settings.gst,gstVal:s.gstVal!=null?+s.gstVal:+settings.gstVal,disc:s.disc!=null?!!s.disc:!!settings.disc,discVal:s.discVal!=null?+s.discVal:+settings.discVal}};
}
function snap(){return JSON.stringify(q)}
function markClean(){qBaseline=q?snap():''}
function isDirty(){return !!q&&snap()!==qBaseline}
function qTotals(){return calcTotals(q.items,q.tax)}

function saveQuote(draft,{silent=false}={}){
  if(!q)return false;
  if(!q.name.trim()){toast(t('siteRequired'));jumpStep(1);return false}
  const isNew=!q.id;
  if(isNew){q.id=Date.now();q.quotNo=nextQuoteNo();q.date=new Date().toLocaleDateString('en-IN');settings.quotNum=(settings.quotNum||1)+1;saveSettings()}
  q.draft=!!draft;
  const {total}=qTotals();
  const entry={id:q.id,quotNo:q.quotNo,name:q.name.trim(),place:q.place,phone:q.phone,validTill:q.validTill,date:q.date,updatedAt:new Date().toISOString(),
    items:JSON.parse(JSON.stringify(q.items)),payments:JSON.parse(JSON.stringify(q.payments)),notes:q.notes,settings:{...q.tax},total,paid:sumPayments(q.payments),draft:q.draft};
  const idx=quotes.findIndex(e=>String(e.id)===String(q.id));
  if(idx>=0)quotes[idx]=entry;else quotes.unshift(entry);
  persistQuotes();markClean();
  if(!silent)toast(tf(isNew?'saved':'updated',{q:q.quotNo}));
  renderChrome();
  return true;
}

// ═══════════════ ROUTER ═══════════════
function parseHash(){const h=(location.hash||'').replace(/^#\/?/,'');const parts=h.split('/');return {r:parts[0]||'home',arg:decodeURIComponent(parts.slice(1).join('/'))}}
function go(path,{replace=false}={}){
  const cur=parseHash().r,dest=path.split('/')[0];
  if(cur==='edit'&&dest!=='edit'&&isDirty()&&!confirm(t('discardConfirm')))return;
  const rep=replace||(TOP.includes(dest)&&TOP.includes(cur)&&cur!=='home');
  if(dest==='edit')editorDepth=cur==='edit'?(rep?editorDepth:editorDepth+1):1;
  history[rep?'replaceState':'pushState'](null,'','#/'+path);
  render();window.scrollTo(0,0);
}
function exitEditor(){const d=Math.max(1,editorDepth);history.go(-d)}
window.addEventListener('popstate',()=>{
  if(overlay){hideOverlay();return}
  const {r}=parseHash();
  if(lastRoute==='edit'&&r!=='edit'&&isDirty()&&!confirm(t('discardConfirm'))){history.pushState(null,'','#/'+lastPath);editorDepth=1;return}
  editorDepth=r==='edit'?Math.max(1,editorDepth-1):0;
  render();
});
// Android back button (called from MainActivity): true = handled here, false = let the app close.
window.srwHandleBack=function(){
  if(overlay){closeOverlay();return true}
  if(parseHash().r!=='home'){history.back();return true}
  return false;
};

function render(){
  const {r,arg}=parseHash();
  if(r!=='settings')bizDraft=null;
  route=r;routeArg=arg;lastRoute=r;lastPath=(location.hash||'#/home').replace(/^#\/?/,'')||'home';
  if(r==='edit'&&!q){q=newQuoteObj();markClean()}
  const pages={home:pageHome,quotes:pageQuotes,customers:pageCustomers,customer:pageCustomer,payments:pagePayments,reports:pageReports,backup:pageBackup,settings:pageSettings,edit:pageEditor};
  const page=(pages[r]||pageHome)(arg);
  document.getElementById('topbar').innerHTML=page.top;
  const stepper=document.getElementById('stepper');stepper.style.display=page.stepper?'flex':'none';stepper.innerHTML=page.stepper||'';
  document.getElementById('view').innerHTML=page.body;
  const foot=document.getElementById('footbar');foot.style.display=page.foot?'block':'none';document.getElementById('footbar-in').innerHTML=page.foot||'';
  document.body.classList.toggle('editor',r==='edit');
  renderBottomNav(r);
  if(page.after)page.after();
}
// Refresh only the chrome (title, stepper, footer) without touching inputs the user is typing in.
function renderChrome(){if(route!=='edit')return;const page=pageEditor(routeArg);document.getElementById('topbar').innerHTML=page.top;document.getElementById('stepper').innerHTML=page.stepper||'';document.getElementById('footbar-in').innerHTML=page.foot||''}

  const nav=document.getElementById('bnav');

  const btn=(id,ic,l)=>`<button class="${active===id?'on':''}" onclick="go('${id}')"><i class="ti ${ic}"></i><span>${esc(t(l))}</span></button>`;
  document.getElementById('bnav-in').innerHTML=btn('home','ti-home','navHome')+btn('quotes','ti-file-text','navQuotes')+
    `<button class="fab" onclick="newQuote()" aria-label="${esc(t('newQuotation'))}"><i class="ti ti-plus"></i></button>`+
    btn('customers','ti-users','navCustomers')+btn('payments','ti-cash','navPayments');

function pageHome(){
  const now=new Date(),mk=monthKey(now),real=quotes.filter(e=>!e.draft);
  const quoted=real.filter(e=>monthKey(entryCreated(e))===mk).reduce((s,e)=>s+(+e.total||0),0);
  const toCollect=real.reduce((s,e)=>s+entryBalance(e),0);
  const count=quotes.filter(e=>monthKey(entryCreated(e))===mk).length;

function pagePayments(){
  const real=quotes.filter(e=>!e.draft);
  const pending=real.filter(e=>entryBalance(e)>0.5).sort((a,b)=>entryBalance(b)-entryBalance(a));
  const toCollect=pending.reduce((s,e)=>s+entryBalance(e),0);
  const business=real.reduce((s,e)=>s+(+e.total||0),0),got=real.reduce((s,e)=>s+entryPaid(e),0);
  const pct=business>0?Math.min(100,Math.round(got/business*100)):0;
  let list='';
  if(payTab==='pending'){
    list=pending.length?pending.map(e=>{
      const pays=entryPayments(e),lastPay=pays.length?new Date(pays[pays.length-1].date):entryCreated(e);
      const days=daysSince(isNaN(lastPay)?entryCreated(e):lastPay);
      return `<button class="card" data-id="${esc(e.id)}" onclick="openQuote(this.dataset.id)"><div class="row"><span class="b ell">${esc(e.name)}</span><span class="b" style="color:var(--due)">₹${fmt(entryBalance(e))}</span></div>

  }else{
    const pays=allPayments().filter(p=>!isNaN(new Date(p.date))).sort((a,b)=>new Date(b.date)-new Date(a.date));
    list=pays.length?pays.map(p=>`<button class="card" data-id="${esc(p.e.id)}" onclick="openQuote(this.dataset.id)"><div class="row"><span class="b ell">${esc(p.e.name)}</span><span class="b" style="color:var(--paid)">+₹${fmt(p.amount)}</span></div>
      <div class="m mt4 ell">${esc(p.e.quotNo||'')} · ${esc(fmtDate(new Date(p.date),{day:'numeric',month:'short',year:'numeric'}))}${p.mode?' · '+esc(t('mode_'+p.mode)):''}${p.note?' · '+esc(p.note):''}</div></button>`).join(''):emptyState('ti-cash-off',t('noReceived'));
  }
  return {
    top:topMenu(t('payments')),
    body:`<div class="card"><div class="m">${esc(tf('toCollectFrom',{n:pending.length}))}</div><div class="b" style="font-size:22px;color:var(--due);margin:2px 0 8px">₹${fmt(toCollect)}</div>

      <div class="chips mt8"><button class="chip ${payTab==='pending'?'on':''}" onclick="payTab='pending';render()">${esc(t('pending'))}</button><button class="chip ${payTab==='received'?'on':''}" onclick="payTab='received';render()">${esc(t('received'))}</button></div>${list}`
  };
}

// ── REPORTS ──
function pageReports(){
  const now=new Date(),real=quotes.filter(e=>!e.draft);
  const months=[];for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push({k:monthKey(d),label:fmtDate(d,{month:'short'}),quoted:0,received:0})}
  real.forEach(e=>{const m=months.find(x=>x.k===monthKey(entryCreated(e)));if(m)m.quoted+=+e.total||0});
  allPayments().forEach(p=>{const d=new Date(p.date);if(isNaN(d))return;const m=months.find(x=>x.k===monthKey(d));if(m)m.received+=+p.amount||0});
  const max=Math.max(1,...months.flatMap(m=>[m.quoted,m.received]));
  const by={due:[0,0],paid:[0,0],draft:[0,0]};quotes.forEach(e=>{const s=statusOf(e);by[s][0]++;by[s][1]+=+e.total||0});
  const top=getCustomers().filter(c=>c.business>0).sort((a,b)=>b.business-a.business).slice(0,5);
  const avg=real.length?real.reduce((s,e)=>s+(+e.total||0),0)/real.length:0;
  return {
    top:topMenu(t('reports')),
    body:!quotes.length?emptyState('ti-chart-bar',t('nothingYet')):`
      <div class="card"><div class="b">${esc(t('last6'))}</div>

        <div class="srow"><span class="m">${esc(t('avgQuote'))}</span><span class="b">₹${fmt(avg)}</span></div></div>
      ${top.length?`<div class="card"><div class="b" style="margin-bottom:4px">${esc(t('topCustomers'))}</div>${top.map((c,i)=>`<div class="srow"><span class="ell">${i+1}. ${esc(c.name)}</span><span class="b">₹${fmt(c.business)}</span></div>`).join('')}</div>`:''}`

// ── PDF details form: edits stay in a draft until "Save PDF details" ──
let bizDraft=null;
function bizForm(){return bizDraft||{bizName:settings.bizName||'',bizTag:settings.bizTag||'',contacts:(settings.contacts||[]).map(c=>({name:c.name||'',phone:c.phone||''})),upiId:settings.upiId||'',upiName:settings.upiName||'',defaultNotes:settings.defaultNotes||''}}
function readBizForm(){
  const v=id=>document.getElementById(id)?.value??'';
  bizDraft={bizName:v('bf-name'),bizTag:v('bf-tag'),upiId:v('bf-upi'),upiName:v('bf-upiname'),defaultNotes:v('bf-notes'),
    contacts:[...document.querySelectorAll('.bf-contact')].map(r=>({name:r.querySelector('.bf-cn').value,phone:r.querySelector('.bf-cp').value}))};
  return bizDraft;
}
function bizEdited(){readBizForm();const e=document.getElementById('bf-err');if(e)e.textContent=t('unsavedChanges')}
function addContactRow(){const d=readBizForm();if(d.contacts.length<3)d.contacts.push({name:'',phone:''});render()}
function removeContactRow(i){const d=readBizForm();d.contacts.splice(i,1);render()}
function saveBizForm(){
  const d=readBizForm(),err=document.getElementById('bf-err');
  const name=d.bizName.trim();
  if(!name){err.textContent=t('bizNameRequired');return}
  const contacts=d.contacts.map(c=>({name:c.name.trim(),phone:c.phone.trim()})).filter(c=>c.name||c.phone);
  if(contacts.some(c=>!c.name||c.phone.replace(/\D/g,'').length<10)){err.textContent=t('contactInvalid');return}
  const upi=d.upiId.trim();
  if(upi&&!isValidUpi(upi)){err.textContent=t('upiInvalid');return}
  Object.assign(settings,{bizName:name,bizTag:d.bizTag.trim(),contacts,upiId:upi,upiName:d.upiName.trim(),defaultNotes:d.defaultNotes});
  saveSettings();bizDraft=null;render();toast(t('pdfDetailsSaved'));
}
function setLanguage(v){if(route==='settings'&&document.getElementById('bf-name'))readBizForm();language=v==='ta'?'ta':'en';localStorage.setItem('srw_language',language);document.documentElement.lang=language;render();if(overlay==='drawer')renderDrawer()}
function clearAllQuotes(){
  if(!quotes.length||!confirm(t('clearAllConfirm')))return;
  markDeleted(quotes.map(e=>e.id));quotes=[];persistQuotes();q=null;render();toast(t('cleared'));
}

// ═══════════════ EDITOR ═══════════════
function newQuote(pre){q=newQuoteObj(pre);markClean();go('edit/1')}
function openQuote(id){const e=findQuote(id);if(!e)return;q=quoteFromEntry(e);markClean();go('edit/3')}
function canReach(step){
  if(step>=2&&!q.name.trim()){toast(t('siteRequired'));return false}
  if(step>=3&&!q.items.length){toast(t('needItems'));return false}
  return true;
}
function nextStep(n){if(canReach(n))go('edit/'+n)}
function jumpStep(n){if(n>1&&!canReach(n))return;if(+routeArg===n)return;history.replaceState(null,'','#/edit/'+n);render();window.scrollTo(0,0)}
function stepperHtml(n){
  const labels=[t('stepCustomer'),t('stepItems'),t('stepReview')];
  return labels.map((l,i)=>{const k=i+1;return (i?`<span class="ln ${k<=n?'ok':''}"></span>`:'')+`<button class="${k===n?'on':''}" onclick="jumpStep(${k})">${k<n?'✓':k} ${esc(l)}</button>`}).join('');
}
function pageEditor(arg){
  const step=Math.min(3,Math.max(1,parseInt(arg)||1));
  const no=currentQuoteNo(),statusTag=q.id?(q.draft?t('draft'):''):t('draft');
  const saveBtn=`<button class="icon-btn" onclick="saveQuote(q.id?q.draft:true)" aria-label="${esc(t('save'))}"><i class="ti ti-device-floppy"></i></button>`;
  const title=q.name.trim()?no+' · '+q.name.trim():(q.id?no:t('newQuotation')+' · '+no);
  const top=step===1
    ?topBack(title,statusTag?`<span class="tag">${esc(statusTag)}</span>`:'','exitEditor()',editorDepth<=1?'ti-x':'ti-arrow-left')
    :topBack(title,saveBtn,editorDepth<=1?'exitEditor()':'history.back()');
  const {total}=qTotals();

// ── UPI ──
function isValidUpi(id){return /^[a-zA-Z0-9._-]{2,256}@[a-zA-Z][a-zA-Z0-9.-]{1,64}$/.test(String(id||'').trim())}
// Standard UPI deep link without an amount, so the customer types what they pay (any UPI app can scan it).
function upiLink(note){
  const p=['pa='+encodeURIComponent(settings.upiId.trim()),'pn='+encodeURIComponent((settings.upiName||settings.bizName||'').trim())];
  p.push('cu=INR');
  if(note)p.push('tn='+encodeURIComponent(note));
  return 'upi://pay?'+p.join('&');
}
function qrDataUrl(text){
  if(typeof qrcode!=='function')return '';
  const qr=qrcode(0,'M');qr.addData(text);qr.make();
  return qr.createDataURL(6,2);
}
function saveUpiId(input){
  const v=input.value.trim();
  if(v&&!isValidUpi(v)){toast(t('upiInvalid'));input.value=settings.upiId||'';return}
  updateSetting('upiId',v);render();
}
// Indian-system number to English words (lakh / crore), for "Rupees … only".
function amountInWords(num){
  num=Math.round(+num||0);
  const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const two=n=>n<20?a[n]:b[Math.floor(n/10)]+(n%10?' '+a[n%10]:'');
  const three=n=>(n>=100?a[Math.floor(n/100)]+' Hundred'+(n%100?' ':''):'')+(n%100?two(n%100):'');
  if(!num)return 'Zero';
  const parts=[],crore=Math.floor(num/1e7);num%=1e7;const lakh=Math.floor(num/1e5);num%=1e5;const thou=Math.floor(num/1e3);num%=1e3;
  if(crore)parts.push((crore>=100?three(crore):two(crore))+' Crore');
  if(lakh)parts.push(two(lakh)+' Lakh');
  if(thou)parts.push(two(thou)+' Thousand');
  if(num)parts.push(three(num));
  return parts.join(' ');
}
// Payment stages are read from the notes ("Advance: 30%" …). Shown only when they add up to 100%.
function paymentSchedule(notes){
  const out=[];
  String(notes||'').split('\n').forEach(line=>{
    const m=/(\d+(?:\.\d+)?)\s*%/.exec(line);if(!m)return;
    let label=line.slice(0,m.index);
    const colon=label.search(/[:：]/);if(colon>=0)label=label.slice(0,colon); // "After Full Work Complete: Balance 20%" -> "After Full Work Complete"
    label=label.replace(/^[\s•*\-–·]+/,'').replace(/[:\-–\s]+$/,'').trim();
    if(!label)label=line.replace(/^[\s•*\-–·]+/,'').trim();
    out.push({label,pct:parseFloat(m[1])});
  });
  const sum=out.reduce((s,x)=>s+x.pct,0);
  return out.length>=2&&Math.abs(sum-100)<0.01?out:[];
}

function renderA4(){document.getElementById('a4-page').innerHTML=buildA4(q)}
const A4_W=794,A4_H=1123,PAGE_MARGIN=50;
function waitForImages(root){return Promise.all(Array.from(root.querySelectorAll('img')).map(img=>img.complete?null:new Promise(r=>{img.onload=img.onerror=r})))}
// Renders the whole quotation (any length) and returns the canvas plus safe page-break points (row bottoms, CSS px).
async function captureA4(){
  renderA4();
  const el=document.getElementById('a4-page');
  await waitForImages(el);await new Promise(r=>setTimeout(r,100));
  const base=el.getBoundingClientRect().top;
  const breaks=Array.from(el.querySelectorAll('#a4-page > table > * > tr, #a4-page > div')).map(n=>Math.ceil(n.getBoundingClientRect().bottom-base)).sort((a,b)=>a-b);
  const contentBottom=(breaks[breaks.length-1]||0)+PAGE_MARGIN;
  const height=Math.max(A4_H,Math.ceil(el.scrollHeight),contentBottom);
  const canvas=await html2canvas(el,{scale:2,useCORS:true,backgroundColor:'#ffffff',width:A4_W,height,windowWidth:A4_W});
  return {canvas,height,breaks,contentBottom};
}
// Splits the capture into A4 pages, breaking between rows rather than through them.
function paginate({height,breaks,contentBottom}){
  if(contentBottom<=A4_H+4)return [{start:0,end:Math.min(height,A4_H),top:0}]; // +4: sub-pixel rounding
  const pages=[];let start=0;
  while(start<contentBottom-PAGE_MARGIN-4){
    const top=pages.length?PAGE_MARGIN:0;let end=start+(A4_H-PAGE_MARGIN-top);
    if(end<contentBottom){const fit=breaks.filter(b=>b>start+40&&b<=end);if(fit.length)end=fit[fit.length-1]}else end=contentBottom;
    pages.push({start,end,top});start=end;
  }
  return pages;
}
function safeFilePart(v){return String(v||'Customer').trim().replace(/\s+/g,'_').replace(/[<>:"|?*\/\\]/g,'_')}
function exportFileName(ext){return currentQuoteNo()+'_'+safeFilePart(q.name)+'.'+ext}
async function createPdfBlob(){
  const cap=await captureA4(),{jsPDF}=window.jspdf,pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'}),scale=cap.canvas.width/A4_W;
  const pages=paginate(cap);
  pages.forEach((pg,i)=>{
    const page=document.createElement('canvas');page.width=cap.canvas.width;page.height=Math.round(A4_H*scale);
    const ctx=page.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,page.width,page.height);
    const h=Math.round((pg.end-pg.start)*scale);
    ctx.drawImage(cap.canvas,0,Math.round(pg.start*scale),page.width,h,0,Math.round(pg.top*scale),page.width,h);
    if(pages.length>1){ctx.fillStyle='#8a5a2b';ctx.font=Math.round(10.5*scale)+'px Arial';ctx.textAlign='right';ctx.fillText(tf('pdfPage',{i:i+1,n:pages.length}),Math.round((A4_W-50)*scale),Math.round((A4_H-22)*scale))}
    if(i)pdf.addPage();
    pdf.addImage(page.toDataURL('image/jpeg',.95),'JPEG',0,0,210,297);
  });
  return {blob:pdf.output('blob'),filename:exportFileName('pdf')};
}
function blobAsBase64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(blob)})}
function canvasToBlob(c,type,qual){return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('Image export failed')),type,qual))}
function sharePlugin(){return window.SRWPdfShare||window.Capacitor?.Plugins?.PdfShare}
function isNativeApp(){return !!window.Capacitor?.isNativePlatform?.()}
// In the Android WebView a link "download" does nothing, so files go through the native share sheet.
async function saveOrShareFile(blob,filename,mimeType){
  const plugin=sharePlugin();
  if(plugin&&isNativeApp()){await plugin.sharePdf({filename,mimeType,pdfBase64:await blobAsBase64(blob),dialogTitle:t('saveOrShare')});return 'shared'}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  return 'downloaded';
}
function setStatus(s){const el=document.getElementById('status');if(el)el.textContent=s}
async function generatePDF(){
  setStatus(t('pdfPreparing'));
  try{const f=await createPdfBlob();const how=await saveOrShareFile(f.blob,f.filename,'application/pdf');setStatus('');if(how==='downloaded')toast(t('pdfSaved'))}
  catch(e){setStatus('');toast(e.message||t('shareFailed'))}
}
async function generateImage(){
  setStatus(t('imagePreparing'));
  try{const {canvas}=await captureA4();const how=await saveOrShareFile(await canvasToBlob(canvas,'image/jpeg',.95),exportFileName('jpg'),'image/jpeg');setStatus('');if(how==='downloaded')toast(t('imageSaved'))}
  catch(e){setStatus('');toast(e.message||t('shareFailed'))}
}
async function shareWA(){
  const {total}=qTotals(),paid=sumPayments(q.payments);
  const msg=`*${settings.bizName||''}*\n${t('quotationNumber')}: ${currentQuoteNo()}\n${t('siteShare')}: ${q.name||'-'}${q.place?' ('+q.place+')':''}\n${t('total')}: ₹${fmt(total)}`+(paid>0?`\n${t('totalReceived')}: ₹${fmt(paid)}\n${t('balanceDue')}: ₹${fmt(Math.max(0,total-paid))}`:'');
  setStatus(t('sharePreparing'));
  try{
    const f=await createPdfBlob(),plugin=sharePlugin();
    if(plugin&&isNativeApp()){await plugin.sharePdf({filename:f.filename,mimeType:'application/pdf',pdfBase64:await blobAsBase64(f.blob),text:msg,dialogTitle:t('whatsappShare')});setStatus('');return}
    const file=new File([f.blob],f.filename,{type:'application/pdf'});
    if(navigator.canShare?.({files:[file]})&&navigator.share){await navigator.share({title:t('whatsappShare'),text:msg,files:[file]});setStatus('');return}
    await saveOrShareFile(f.blob,f.filename,'application/pdf');
    window.open('https://wa.me/'+(waNumber(q.phone)||'')+'?text='+encodeURIComponent(msg),'_blank');setStatus('');toast(t('pdfDownloadedAttach'));
  }catch(e){setStatus('');if(e?.name!=='AbortError')toast(e.message||t('shareFailed'))}
}
async function doPrint(){
  // Android WebView has no window.print(); the share sheet lets a print service / PDF app print it.
  if(isNativeApp()&&sharePlugin()){toast(t('printViaShare'));return generatePDF()}
  renderA4();await waitForImages(document.getElementById('a4-page'));
  const w=window.open('','_blank');if(!w){toast(t('shareFailed'));return}
  w.document.write('<html><head><title>'+esc(currentQuoteNo())+'</title><base href="'+document.baseURI+'"><style>body{margin:0}@page{size:A4;margin:0}</style></head><body>'+document.getElementById('a4-page').outerHTML+'</body></html>');
  w.document.close();setTimeout(()=>{w.focus();w.print()},400);
}

// ═══════════════ OFFLINE BACKUP ═══════════════
// A .json file the user keeps anywhere (WhatsApp, Drive app, phone storage) and restores from on any phone.
function offlineLastText(){const s=localStorage.getItem('srw_offline_last');return s?tf('offlineLast',{t:new Date(s).toLocaleString(locale(),{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}):t('offlineNever')}
// Merges a backup file into this phone: newest edit of each quote wins,
// deleted quotes stay deleted, newer settings win, and the next quote number never goes backwards.
function mergeBackupData(remote){
  const deleted=getDeleted();
  Object.entries(remote.deleted||{}).forEach(([id,at])=>{if(String(at)>String(deleted[id]||''))deleted[id]=at});
  setDeleted(deleted);
  if(Array.isArray(remote.history)){
    const merged=new Map();
    remote.history.forEach(e=>merged.set(String(e.id),e));
    quotes.forEach(e=>{const k=String(e.id),old=merged.get(k);if(!old||String(e.updatedAt||'')>=String(old.updatedAt||''))merged.set(k,e)});
    Object.keys(deleted).forEach(id=>merged.delete(id));
    quotes=[...merged.values()].sort((a,b)=>Number(b.id)-Number(a.id));
    persistQuotes();
  }
  const remoteStamp=remote.settingsUpdatedAt||'',localStamp=localStorage.getItem('srw_settings_updated')||'';
  if(remote.settings&&remoteStamp>localStamp){
    settings={...DEFAULT_SETTINGS,...settings,...remote.settings,quotNum:Math.max(settings.quotNum||1,remote.settings.quotNum||1)};
    localStorage.setItem('srw_settings',JSON.stringify(settings));localStorage.setItem('srw_settings_updated',remoteStamp);
  }else if((remote.settings?.quotNum||0)>settings.quotNum){settings.quotNum=remote.settings.quotNum;saveSettings()}
  ensureQuotNumAboveHistory();
}
function backupPayload(){return {app:'raya-wood-works',schemaVersion:3,updatedAt:new Date().toISOString(),history:quotes,deleted:getDeleted(),settings,settingsUpdatedAt:localStorage.getItem('srw_settings_updated')||new Date().toISOString()}}

async function exportBackupFile(){
  try{
    const blob=new Blob([JSON.stringify(backupPayload())],{type:'application/json'});
    const name='raya-backup-'+localISODate(new Date())+'.json';
    const how=await saveOrShareFile(blob,name,'application/json');
    localStorage.setItem('srw_offline_last',new Date().toISOString());
    render();
    if(how==='downloaded')toast(t('offlineSaved'));
  }catch(e){toast(e.message||t('shareFailed'))}
}
function pickBackupFile(){document.getElementById('backup-file').click()}
function importBackupFile(input){
  const f=input.files&&input.files[0];input.value='';
  if(!f)return;
  const reader=new FileReader();
  reader.onload=()=>{
    let data;
    try{data=JSON.parse(String(reader.result))}catch(e){toast(t('offlineBadFile'));return}
    if(!data||!Array.isArray(data.history)){toast(t('offlineBadFile'));return}
    const when=data.updatedAt?new Date(data.updatedAt).toLocaleString(locale(),{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'}):'?';
    if(!confirm(tf('offlineConfirm',{n:data.history.length,d:when})))return;
    const before=new Set(quotes.map(e=>String(e.id)));
    mergeBackupData(data);
    const added=quotes.filter(e=>!before.has(String(e.id))).length;
    q=null;render();
    toast(tf('offlineRestored',{n:added}));
  };
  reader.onerror=()=>toast(t('offlineBadFile'));
  reader.readAsText(f);
}
// ═══════════════ APP UPDATES (GitHub Releases) ═══════════════
// Each push to GitHub builds a signed APK release (tag v<versionCode>). The installed app compares
// its own versionCode with the latest release and offers to download and install the new APK.
const UPDATE_REPO='Muthu1203-abi/raya-wood-works';
let appVersion=null,pendingUpdate=null,updateBusy=false,lastUpdateCheck=0;
const UPDATE_RECHECK_MS=6*60*60*1000; // when the app comes back from the background, ask again at most every 6 hours
function updaterPlugin(){return window.SRWUpdater||window.Capacitor?.Plugins?.Updater}
async function getAppVersion(){
  if(appVersion)return appVersion;
  const p=updaterPlugin();
  if(p&&isNativeApp()){try{appVersion=await p.getVersion()}catch(e){}}
  return appVersion;
}
async function checkForUpdate(manual){
  const v=await getAppVersion();
  if(!v){if(manual)toast(t('updateOnlyApp'));return}
  if(manual)toast(t('updateChecking'));
  lastUpdateCheck=Date.now();
  try{
    const res=await fetch('https://api.github.com/repos/'+UPDATE_REPO+'/releases/latest',{headers:{Accept:'application/vnd.github+json'},cache:'no-store'});
    if(!res.ok)throw new Error('GitHub '+res.status);
    const rel=await res.json();
    const code=parseInt(String(rel.tag_name||'').replace(/\D/g,''),10)||0;
    const apk=(rel.assets||[]).find(a=>/\.apk$/i.test(a.name));
    if(!apk||code<=Number(v.versionCode)){if(manual)toast(t('updateNone'));return}
    pendingUpdate={code,name:rel.name||rel.tag_name,notes:String(rel.body||'').trim().split(String.fromCharCode(10))[0].trim(),url:apk.browser_download_url,size:+apk.size||0};
    if(route==='settings')render();
    // Automatic checks never interrupt someone in the middle of writing a quotation.
    if(manual||route!=='edit')showUpdateSheet();
  }catch(e){if(manual)toast(t('updateFailed'))}
}
// Android often keeps the app in the background instead of closing it, so a "Later" would otherwise
// only come back after a full restart. Re-check when the app is brought back to the screen.
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&Date.now()-lastUpdateCheck>UPDATE_RECHECK_MS)checkForUpdate(false);
});
function showUpdateSheet(){
  if(!pendingUpdate||overlay)return;
  const u=pendingUpdate;
  openSheet(`<h3><i class="ti ti-download" style="color:var(--gold)"></i> ${esc(t('updateTitle'))}</h3>
    <div class="m">${esc(tf('updateVersion',{v:u.name}))}${u.size?' · '+(u.size/1048576).toFixed(1)+' MB':''}</div>
    ${u.notes?`<div class="card mt12" style="white-space:pre-wrap;font-size:13px;max-height:180px;overflow:auto;margin-bottom:0">${esc(u.notes)}</div>`:''}
    <div class="m mt8">${esc(t('updateSafe'))}</div>
    <div id="upd-progress" style="display:none" class="mt12"><div class="progress"><div id="upd-bar" style="width:0%"></div></div><div class="m mt4" id="upd-text"></div></div>
    <button class="btn btn-gold mt12" id="upd-btn" onclick="startUpdate()"><i class="ti ti-download"></i>${esc(t('updateDownload'))}</button>
    <button class="btn mt8" style="color:var(--sub)" onclick="closeOverlay()">${esc(t('updateLater'))}</button>`);
}
async function startUpdate(){
  const p=updaterPlugin();if(!p||!pendingUpdate||updateBusy)return;
  const btn=document.getElementById('upd-btn'),box=document.getElementById('upd-progress'),bar=document.getElementById('upd-bar'),txt=document.getElementById('upd-text');
  let listener=null;
  try{
    const perm=await p.canInstall();
    // Android asks once: "Allow installs from this app". After allowing, the user comes back and taps again.
    if(!perm.allowed){toast(t('updateAllow'));await p.openInstallSettings();return}
    updateBusy=true;btn.disabled=true;btn.style.opacity='.6';box.style.display='block';txt.textContent=tf('updateProgress',{p:0});
    listener=await p.addListener('downloadProgress',d=>{bar.style.width=d.percent+'%';txt.textContent=tf('updateProgress',{p:d.percent})});
    await p.downloadAndInstall({url:pendingUpdate.url});
    bar.style.width='100%';txt.textContent=t('updateInstalling');
  }catch(e){toast(e.message||t('updateFailed'));box.style.display='none'}
  finally{updateBusy=false;if(btn){btn.disabled=false;btn.style.opacity=''}if(listener)listener.remove()}
}

// ═══════════════ TOAST + INIT ═══════════════
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2600)}
// Hide the fixed bottom bars while the keyboard is up so they don't cover the field being typed in.
document.addEventListener('focusin',e=>{if(e.target.matches('input:not([type=checkbox]):not([type=radio]),textarea'))document.body.classList.add('kb')});
document.addEventListener('focusout',()=>setTimeout(()=>{const a=document.activeElement;if(!a||!a.matches('input,textarea'))document.body.classList.remove('kb')},80));

function init(){
  loadData();
  document.documentElement.lang=language;
  history.replaceState(null,'','#/home'); // the app always starts at Home, so Back from any page ends here
  render();
  setTimeout(()=>checkForUpdate(false),1500);
}
init();
</script>
